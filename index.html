<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Daily Paper Creatives Map</title>
<style>
:root{
  --z:1;
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1b1b1f; --muted:#6b6b73; --line:#e1dfd9; --card:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.06);
  --feed:#f97316; --accent:#1b1b1f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --panel:#1b1b1f; --ink:#f2f1ee; --muted:#9a9aa3; --line:#2c2c32; --card:#1b1b1f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); --accent:#f2f1ee;
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --panel:#1b1b1f; --ink:#f2f1ee; --muted:#9a9aa3; --line:#2c2c32; --card:#1b1b1f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); --accent:#f2f1ee;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
header{flex:none;display:flex;gap:12px 16px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.01em}
.status{flex:1;min-width:200px;color:var(--muted);font-size:13px}
.status b{color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn[disabled]{opacity:.4;cursor:default}
.tog{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
main{flex:1;display:flex;min-height:0}
aside{flex:none;width:340px;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:12px 12px 40px}
aside h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 4px 8px}
aside h2:first-child{margin-top:4px}
.item{display:flex;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px;cursor:pointer;align-items:flex-start}
.item:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.item[aria-pressed="true"]{border-color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,var(--ink)) 12%,transparent)}
.badge{flex:none;width:26px;height:26px;border-radius:7px;background:var(--c,#888);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;letter-spacing:-.02em}
.badge.feed{background:transparent;color:var(--feed);border:2px dashed var(--feed)}
.item .t{min-width:0;flex:1}
.item .n{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.item .u{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere;margin-top:2px;white-space:pre-line}
.item .u i{font-style:normal;font-weight:600;margin-right:4px}
.item .k{flex:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:3px}
.warn{color:#b45309;font-size:11.5px;margin-top:2px}
.glob{font-size:12px;color:var(--muted);padding:2px 8px}
.glob div{margin:3px 0;overflow-wrap:anywhere}
.notes{font-size:12px;color:var(--muted);padding:2px 8px}
.notes p{margin:4px 0}
#map{flex:1;overflow:auto;padding:20px 24px 60px}
.flows{display:grid;column-gap:calc(56px*var(--z));row-gap:calc(8px*var(--z));align-items:start;width:max-content}
.flows>*{min-width:0}
.fhead{align-self:end}
.srch{display:flex;align-items:center;gap:6px}
.srch input{width:200px;max-width:40vw;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:13px}
.srch input::placeholder{color:var(--muted)}
.flows .gone{display:none}
.srchinfo{font-size:12px;color:var(--muted)}
.flow h3{margin:0 0 6px;font-size:clamp(11px,calc(14px*var(--z)),14px);letter-spacing:.06em;text-transform:uppercase}
.flow .rule{height:2px;background:var(--line);margin-bottom:18px}
.lang{margin-bottom:28px}
.lang h4{margin:0 0 10px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:calc(16px*var(--z));align-items:flex-start}
.card{width:calc(300px*var(--z));flex:none;transition:opacity .18s}
.zsm .card .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttlrow{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.btnrow{display:flex;gap:4px;flex-wrap:wrap}
.zmd .lbl{display:none}
.zmd .cmt,.zmd .fbBtn{padding:4px 7px}
.ttlrow .ttl{width:100%;min-width:0;margin-bottom:0!important}
.cmt{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;font-size:11px;line-height:1;padding:4px 6px;cursor:pointer;display:none}
.cmt.ok{display:block}
.fbBtn{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;font-size:11px;line-height:1;padding:4px 6px;cursor:pointer}
.fbBtn:hover{color:var(--ink);border-color:var(--muted)}
.zsm .fbBtn{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1b1f;color:#f2f1ee;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;z-index:60;max-width:90vw}
.fbdlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;place-items:center;padding:16px}
.fbbox{background:var(--panel);color:var(--ink);border-radius:14px;padding:20px;max-width:460px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.fbbox h3{margin:0 0 8px;font-size:16px}
.fbbox p{margin:0 0 10px;color:var(--muted);font-size:13px}
.fbbox input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:13px system-ui}
.fbrow{display:flex;gap:8px;margin-top:12px}
.fbnote{margin:10px 0 0!important}
.hdrfb{background:var(--ink);color:var(--bg);border-color:var(--ink);text-decoration:none;display:inline-block}
.cmt:hover{color:var(--ink);border-color:var(--muted)}
.zsm .cmt{display:none!important}
.card .ttl{font-weight:600;font-size:clamp(9px,calc(12.5px*var(--z)),12.5px);margin-bottom:6px;overflow-wrap:anywhere}
.shot{position:relative;width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.shot img{display:block;width:100%;height:auto}
.shot .ph{display:grid;place-items:center;height:160px;color:var(--muted);font-size:12px}
.flag{font-size:11px;color:#b45309;margin-top:4px}
.pin{position:absolute;border:1.5px solid var(--c);border-radius:3px;background:color-mix(in srgb,var(--c) 10%,transparent);cursor:pointer;opacity:.75;transition:opacity .15s,background .15s,box-shadow .15s}
.pin::after{content:attr(data-code);position:absolute;left:-1px;top:-1px;transform:translate(-30%,-50%) scale(clamp(.6,var(--z),1));min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--c);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 1.5px var(--card)}
.pin:hover{opacity:1}
.feedbox{position:absolute;border:2px dashed var(--feed);border-radius:4px;cursor:pointer;opacity:.85;transition:opacity .15s,background .15s}
.feedbox::after{content:attr(data-num);position:absolute;left:4px;top:4px;min-width:18px;height:18px;border-radius:9px;background:var(--feed);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;padding:0 4px}
.hide-pins .pin,.hide-pins .feedbox{opacity:0;pointer-events:none}
/* selection state */
.has-sel .card{opacity:.22}
.has-sel .card.match{opacity:1}
.has-sel .card.match .shot{box-shadow:0 0 0 2px var(--ink),var(--shadow)}
.has-sel .pin:not(.on),.has-sel .feedbox:not(.on){opacity:.0;pointer-events:none}
.has-sel .hide-pins .pin.on,.has-sel.hide-pins .pin.on{opacity:1}
.pin.on{opacity:1;z-index:2;background:color-mix(in srgb,var(--c) 32%,transparent);border-width:3px;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 35%,transparent),0 0 18px color-mix(in srgb,var(--c) 55%,transparent)}
.pin.on::after{transform:translate(-30%,-50%) scale(calc(clamp(.6,var(--z),1)*1.35))}
.feedbox.on{opacity:1;z-index:2;background:color-mix(in srgb,var(--feed) 22%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--feed) 35%,transparent)}
.hide-pins.has-sel .pin.on,.hide-pins.has-sel .feedbox.on{opacity:1;pointer-events:auto}
#tip{position:fixed;z-index:50;max-width:380px;pointer-events:none;background:#1b1b1f;color:#f2f1ee;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;overflow-wrap:anywhere}
#tip b{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;padding:0 4px;margin-right:6px;font-size:11px;color:#fff;vertical-align:1px}
#tip .nm{font-weight:600}
#tip .lk{margin-top:4px;color:#cfd3ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
#tip .tx{margin-top:2px;color:#9a9aa3}
.zoom{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.zoom input{width:120px;accent-color:var(--accent)}
.zoom span{min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  main{flex-direction:column}
  aside{width:auto;max-height:38vh;border-right:0;border-bottom:1px solid var(--line)}
  #map{padding:16px}
}
</style>
</head>

  document.querySelectorAll(".item").forEach((b) => b.setAttribute("aria-pressed", sel.has(b.dataset.key)));
  document.querySelectorAll(".pin,.feedbox").forEach((p) => p.classList.toggle("on", sel.has(p.dataset.key)));
  let matches = 0, placements = 0;
  cards.forEach((c) => {
    const hit = [...sel].some((k) => c._keys.has(k));
    c.classList.toggle("match", hit);
    if (hit) { matches++; placements += c.querySelectorAll(".pin.on,.feedbox.on").length; }
  });
  $("#clear").disabled = !has; $("#prev").disabled = $("#next").disabled = !matches;
  const names = [...sel].map((k) => { const [t, v] = k.split(":"); return t === "L" ? v : "feed " + v; }).join(", ");
  $("#status").innerHTML = has
    ? `<b>${esc(names)}</b> — in <b>${matches}</b> of ${cards.length} emails · ${placements} placement${placements === 1 ? "" : "s"}`
    : "Click a code in the legend (or a pin on an email) to light up every place it is linked.";
}
function step(d) {
  const hits = cards.filter((c) => c.classList.contains("match") && !c.closest(".gone"));
  if (!hits.length) return;
  matchIdx = (matchIdx + d + hits.length) % hits.length;
  hits[matchIdx].scrollIntoView({ behavior: "smooth", inline: "center", block: "center" });
}
$("#clear").addEventListener("click", () => { sel.clear(); apply(); });
$("#next").addEventListener("click", () => step(1));
$("#prev").addEventListener("click", () => step(-1));
$("#showall").addEventListener("change", apply);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { sel.clear(); apply(); } });
apply();
</script>
</body>
</html>
